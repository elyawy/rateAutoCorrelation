[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-autocorrelation"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "torch==2.4.1",
  "matplotlib==3.9.2",
  "msasim==26.8.1",
  "ete3==3.1.3",
]

[tool.setuptools]
py-modules = ["config"]
packages = ["common", "training", "pipeline", "experiments", "figures"]