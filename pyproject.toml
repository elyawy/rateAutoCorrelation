[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-autocorrelation"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "torch==2.12.0",
  "matplotlib==3.10.9",
  "msasim==26.8.1",
  "ete3==3.1.3",
  "pyarrow==25.0.1",
  "biopython==1.88",
]

[tool.setuptools]
py-modules = ["config"]
packages = ["common", "training", "pipeline", "experiments", "figures"]